name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Type check
        run: mypy src/
        
      - name: Lint
        run: ruff check src/
        
      - name: Run tests
        run: pytest --cov=src --cov-report=xml
        
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: ncaab-predictor:latest
          
  lint-commit:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Check commit messages
        run: |
          # Conventional commits check
          commits=$(git log --format=%s ${{ github.event.before }}..${{ github.event.after }})
          for commit in $commits; do
            echo "Checking: $commit"
            # Allow certain patterns
            if [[ "$commit" =~ ^(feat|fix|docs|style|refactor|test|chore|research): ]]; then
              echo "✓ Valid commit message"
            else
              echo "✗ Invalid commit message: $commit"
              echo "Use conventional commits: feat:, fix:, docs:, etc."
              exit 1
            fi
          done
