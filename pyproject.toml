[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goalpost"
version = "0.1.0"
description = "NFL drive modeling via team representations and transition simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "polars>=0.20",
    "nflreadpy>=0.1",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
